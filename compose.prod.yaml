name: webmaster-automation-prod

# x-app - 공통 설정
# 마이그레이션과 API는 같은 이미지와 DB 연결 설정을 사용합니다.
x-app: &app
  image: startpress-api:prod
  build: .
  environment:
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 .env.prod에 설정하세요}

# 실행할 컨테이너
services:
  db:
    image: postgres:18.6
    ## 직접 멈춰둔 경우를 제외하고 프로세스에 문제 생기면 다시 실행하게 하는 것
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env.prod에 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env.prod에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env.prod에 설정하세요}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
  # 위에서 &app이라는 이름을 붙인 설정을 현재 위치에 합쳐 넣는것
    <<: *app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL을 .env.prod에 설정하세요}
      BING_API_KEY: ${BING_API_KEY:?BING_API_KEY를 .env.prod에 설정하세요}
      GOOGLE_TOKEN_FILE: ${GOOGLE_TOKEN_FILE:?GOOGLE_TOKEN_FILE을 .env.prod에 설정하세요}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: /home/ubuntu/webmaster-secrets
        target: /srv/startpress/.secrets
        bind:
          create_host_path: false
    ports:
      # 팀 접근 경로를 구성하기 전에는 호스트에서만 접속할 수 있습니다.
      - "127.0.0.1:${STARTPRESS_API_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

# data를 보관할 저장 공간
volumes:
  postgres_data:
