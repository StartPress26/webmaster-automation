[project]
name = "webmaster-automation"
version = "0.1.0"
description = "검색엔진 공식 API 검증"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "google-auth-oauthlib>=1.2,<2",
    "google-auth[requests]>=2.29,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2.1,<3",
]

[dependency-groups]
dev = ["anyio>=4,<5", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: 실제 PostgreSQL의 임시 DB에서 실행하는 통합 테스트"]
